name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 純邏輯層:無 GL/無 cgo,快速跑全測(kbrng parity、資料表、gamestate、combat…)。
  # render/screen 匯入 ebiten(需 GL+顯示器)→ 併到 build-desktop 用 xvfb 跑。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: go vet + test (logic packages)
        run: |
          PKGS="./internal/kbdata/... ./internal/gamestate/... ./internal/kbrng/... ./internal/input/... ./internal/combat/..."
          go vet $PKGS
          go test $PKGS

  # 桌面:Ebiten 需 X11/GL 開發標頭 + cgo,驗 cmd/openkb 編得起來
  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: install GL/X11 headers + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgl1-mesa-dri libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev xvfb
      - name: build desktop
        run: go build ./cmd/openkb
      - name: test render + screen (needs display)
        run: xvfb-run -a go test ./internal/render/... ./internal/screen/...

  # 手機:ebitenmobile bind 出 Android AAR 的 smoke(Android-only,依使用者需求)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: install ebitenmobile (pin 到 go.mod 的 ebiten 版本, 避免生成 Java 對不上)
        run: go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.7.10
      - name: bind android aar (smoke)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ebitenmobile bind -target android -javapkg com.wicanr2.openkb \
            -o openkb.aar ./mobile
